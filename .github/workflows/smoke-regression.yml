name: Smoke Regression

on:
  push:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "runtime_config.example.json"
      - "requirements-runtime.txt"
      - "scripts/**"
      - "tests/**"
      - "references/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "runtime_config.example.json"
      - "requirements-runtime.txt"
      - "scripts/**"
      - "tests/**"
      - "references/**"

jobs:
  quick-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          jdeps -version
          mvn -version

      - name: Run Quick Quality Gate
        run: >-
          python scripts/quality_gate.py --profile quick
          --json-out /tmp/jua-quick-quality-gate.json

  step5-regression:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Verify Maven
        run: mvn -version

      - name: Run Step5 Quality Gate
        run: >-
          python scripts/quality_gate.py --profile step5
          --json-out /tmp/jua-step5-quality-gate.json
