name: Smoke Regression

on:
  push:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "docs/**"
      - "runtime_config.example.json"
      - "requirements-runtime.txt"
      - "scripts/**"
      - "tests/**"
      - "references/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "docs/**"
      - "runtime_config.example.json"
      - "requirements-runtime.txt"
      - "scripts/**"
      - "tests/**"
      - "references/**"

jobs:
  quick-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          jdeps -version
          mvn -version

      - name: Run Quick Quality Gate
        run: >-
          python scripts/quality_gate.py --profile quick
          --json-out "${{ runner.temp }}/jua-quick-quality-gate.json"

      - name: Upload Quick Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-quick-quality-python-${{ matrix.python }}
          path: ${{ runner.temp }}/jua-quick-quality-gate.json

  blackbox-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Reference Java 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Record Reference Java 8 Home
        shell: bash
        run: echo "JAVA8_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Reference Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Record Reference Java 17 Home
        shell: bash
        run: echo "JAVA17_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          mvn -version
          gradle --version

      - name: Run Complete Independent Black-box Gate
        run: >-
          python scripts/quality_gate.py --profile blackbox
          --json-out "${{ runner.temp }}/jua-blackbox-quality-gate.json"

      - name: Upload Black-box Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-blackbox-quality
          path: ${{ runner.temp }}/jua-blackbox-quality-gate.json

  whitebox-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Reference Java 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Record Reference Java 8 Home
        shell: bash
        run: echo "JAVA8_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Reference Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Record Reference Java 17 Home
        shell: bash
        run: echo "JAVA17_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          mvn -version
          gradle --version

      - name: Run Complete White-box Gate
        run: >-
          python scripts/quality_gate.py --profile whitebox
          --json-out "${{ runner.temp }}/jua-whitebox-quality-gate.json"

      - name: Upload White-box Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-whitebox-quality
          path: ${{ runner.temp }}/jua-whitebox-quality-gate.json

  performance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Reference Java 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Record Reference Java 8 Home
        shell: bash
        run: echo "JAVA8_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Reference Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Record Reference Java 17 Home
        shell: bash
        run: echo "JAVA17_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          mvn -version
          gradle --version

      - name: Run Complete Performance Regression Gate
        run: >-
          python scripts/quality_gate.py --profile performance
          --json-out "${{ runner.temp }}/jua-performance-quality-gate.json"

      - name: Upload Performance Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-performance-quality
          path: ${{ runner.temp }}/jua-performance-quality-gate.json

  test-effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Branch Mutation and Repeatability Gate
        run: >-
          python scripts/binary_test_health_gate.py
          --output "${{ runner.temp }}/jua-test-effectiveness.json"

      - name: Upload Test Effectiveness Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-test-effectiveness
          path: ${{ runner.temp }}/jua-test-effectiveness.json

  pre-merge-quality:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [quick-regression, blackbox-regression, whitebox-regression, performance-regression, test-effectiveness]
    runs-on: ubuntu-latest
    steps:
      - name: Require Every Pre-merge Gate
        shell: bash
        env:
          QUICK_RESULT: ${{ needs.quick-regression.result }}
          BLACKBOX_RESULT: ${{ needs.blackbox-regression.result }}
          WHITEBOX_RESULT: ${{ needs.whitebox-regression.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-regression.result }}
          EFFECTIVENESS_RESULT: ${{ needs.test-effectiveness.result }}
        run: |
          test "${QUICK_RESULT}" = "success"
          test "${BLACKBOX_RESULT}" = "success"
          test "${WHITEBOX_RESULT}" = "success"
          test "${PERFORMANCE_RESULT}" = "success"
          test "${EFFECTIVENESS_RESULT}" = "success"
