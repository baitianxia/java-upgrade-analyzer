name: Smoke Regression

on:
  push:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "runtime_config.example.json"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-regression.yml"
      - "README.md"
      - "RUNBOOK.md"
      - "SKILL.md"
      - "QUALITY_GATES.md"
      - "TESTING_STRATEGY.md"
      - "runtime_config.example.json"
      - "scripts/**"
      - "tests/**"

jobs:
  smoke-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tree-sitter tree-sitter-java

      - name: Run Quick Quality Gate
        run: python scripts/quality_gate.py --profile quick
