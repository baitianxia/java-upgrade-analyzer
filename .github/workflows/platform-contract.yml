name: Platform Contract

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - "scripts/**"
      - "tests/**"
      - "SKILL.md"
      - ".github/workflows/platform-contract.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "SKILL.md"
      - ".github/workflows/platform-contract.yml"

jobs:
  platform-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify Maven
        run: mvn -version

      - name: Install Declared Runtime Dependencies
        run: python -m pip install "tree-sitter==0.25.2" "tree-sitter-java==0.23.5"

      - name: Run Platform Contract
        run: >-
          python scripts/quality_gate.py --profile quick --skip-real
          --report-root "${{ runner.temp }}/jua-platform-contract"
          --json-out "${{ runner.temp }}/platform-contract.json"

      - name: Upload Platform Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-contract-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            ${{ runner.temp }}/platform-contract.json
            ${{ runner.temp }}/jua-platform-contract
