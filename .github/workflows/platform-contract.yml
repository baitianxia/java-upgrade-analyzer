name: Platform Contract

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "codex/**"
    paths:
      - "scripts/**"
      - "tests/**"
      - "SKILL.md"
      - ".github/workflows/platform-contract.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "SKILL.md"
      - ".github/workflows/platform-contract.yml"

jobs:
  platform-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Verify Maven
        id: verify_maven
        run: mvn -version

      - name: Install Declared Runtime Dependencies
        id: install_dependencies
        run: python -m pip install "tree-sitter==0.25.2" "tree-sitter-java==0.23.5"

      - name: Run Platform Contract
        id: quality_gate
        run: >-
          python scripts/quality_gate.py --profile quick --skip-real
          --report-root "${{ runner.temp }}/jua-platform-contract"
          --json-out "${{ runner.temp }}/platform-contract.json"

      - name: Record Platform Cell Result
        if: always()
        shell: bash
        env:
          CELL_STATUS: ${{ job.status }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_JAVA: ${{ matrix.java }}
          CELL_RESULT_PATH: ${{ runner.temp }}/platform-cell-${{ matrix.os }}-jdk${{ matrix.java }}.txt
          QUALITY_GATE_JSON: ${{ runner.temp }}/platform-contract.json
          ACCURACY_BENCHMARK_JSON: ${{ runner.temp }}/jua-platform-contract/accuracy_benchmark_core.json
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          SETUP_JAVA_OUTCOME: ${{ steps.setup_java.outcome }}
          VERIFY_MAVEN_OUTCOME: ${{ steps.verify_maven.outcome }}
          INSTALL_DEPENDENCIES_OUTCOME: ${{ steps.install_dependencies.outcome }}
          QUALITY_GATE_OUTCOME: ${{ steps.quality_gate.outcome }}
        run: |
          printf '%s|%s|%s\n' "${CELL_STATUS}" "${MATRIX_OS}" "${MATRIX_JAVA}" > "${CELL_RESULT_PATH}"
          printf 'step|checkout|%s\n' "${CHECKOUT_OUTCOME}" >> "${CELL_RESULT_PATH}"
          printf 'step|setup-python|%s\n' "${SETUP_PYTHON_OUTCOME}" >> "${CELL_RESULT_PATH}"
          printf 'step|setup-java|%s\n' "${SETUP_JAVA_OUTCOME}" >> "${CELL_RESULT_PATH}"
          printf 'step|verify-maven|%s\n' "${VERIFY_MAVEN_OUTCOME}" >> "${CELL_RESULT_PATH}"
          printf 'step|install-dependencies|%s\n' "${INSTALL_DEPENDENCIES_OUTCOME}" >> "${CELL_RESULT_PATH}"
          printf 'step|quality-gate|%s\n' "${QUALITY_GATE_OUTCOME}" >> "${CELL_RESULT_PATH}"
          python - "${QUALITY_GATE_JSON}" "${ACCURACY_BENCHMARK_JSON}" "${CELL_RESULT_PATH}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          benchmark_source = Path(sys.argv[2])
          destination = Path(sys.argv[3])
          with destination.open("a", encoding="utf-8", newline="\n") as handle:
              if not source.is_file():
                  handle.write("gate|quality-gate-report|missing\n")
              else:
                  payload = json.loads(source.read_text(encoding="utf-8"))
                  for result in payload.get("results") or []:
                      status = str(result.get("status") or "missing")
                      if status == "passed":
                          continue
                      name = re.sub(r"[^A-Za-z0-9._-]+", "-", str(result.get("name") or "unknown"))
                      status = re.sub(r"[^A-Za-z0-9._-]+", "-", status)
                      handle.write(f"gate|{name}|{status}\n")
              if benchmark_source.is_file():
                  payload = json.loads(benchmark_source.read_text(encoding="utf-8"))
                  for result in payload.get("results") or []:
                      status = str(result.get("status") or "missing")
                      if status == "passed":
                          continue
                      name = re.sub(r"[^A-Za-z0-9._-]+", "-", str(result.get("name") or "unknown"))
                      status = re.sub(r"[^A-Za-z0-9._-]+", "-", status)
                      handle.write(f"benchmark|{name}|{status}\n")
          PY

      - name: Upload Platform Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-contract-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            ${{ runner.temp }}/platform-contract.json
            ${{ runner.temp }}/jua-platform-contract
            ${{ runner.temp }}/platform-cell-${{ matrix.os }}-jdk${{ matrix.java }}.txt

  platform-evidence:
    needs: platform-contract
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download platform cell evidence
        uses: actions/download-artifact@v4
        with:
          pattern: platform-contract-*
          path: ${{ runner.temp }}/platform-cells
          merge-multiple: true

      - name: Publish immutable platform verification tag
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.platform-contract.result }}
          CELL_RESULTS_DIR: ${{ runner.temp }}/platform-cells
        run: |
          set -euo pipefail
          publish_tag() {
            local tag="$1"
            local ref="refs/tags/${tag}"
            local remote_sha
            remote_sha="$(git ls-remote --tags origin "${ref}" | awk '{print $1}')"
            if [[ -n "${remote_sha}" ]]; then
              test "${remote_sha}" = "${GITHUB_SHA}"
              return
            fi
            git tag "${tag}" "${GITHUB_SHA}"
            if ! git push origin "${ref}"; then
              remote_sha="$(git ls-remote --tags origin "${ref}" | awk '{print $1}')"
              test "${remote_sha}" = "${GITHUB_SHA}"
            fi
          }

          shopt -s nullglob
          cell_files=("${CELL_RESULTS_DIR}"/platform-cell-*.txt)
          test "${#cell_files[@]}" -eq 9
          for result_file in "${cell_files[@]}"; do
            IFS='|' read -r CELL_STATUS MATRIX_OS MATRIX_JAVA < "${result_file}"
            case "${CELL_STATUS}" in
              success|failure|cancelled) ;;
              *) exit 1 ;;
            esac
            publish_tag "platform-contract-cell-${CELL_STATUS}-${MATRIX_OS}-jdk${MATRIX_JAVA}-${GITHUB_SHA}"
            while IFS='|' read -r RECORD_KIND STEP_NAME STEP_OUTCOME; do
              if [[ "${RECORD_KIND}" = "gate" ]]; then
                GATE_NAME="${STEP_NAME}"
                GATE_STATUS="${STEP_OUTCOME}"
                publish_tag "platform-contract-gate-${GATE_STATUS}-${GATE_NAME}-${MATRIX_OS}-jdk${MATRIX_JAVA}-${GITHUB_SHA}"
                continue
              fi
              if [[ "${RECORD_KIND}" = "benchmark" ]]; then
                BENCHMARK_NAME="${STEP_NAME}"
                BENCHMARK_STATUS="${STEP_OUTCOME}"
                publish_tag "platform-contract-benchmark-${BENCHMARK_STATUS}-${BENCHMARK_NAME}-${MATRIX_OS}-jdk${MATRIX_JAVA}-${GITHUB_SHA}"
                continue
              fi
              if [[ "${RECORD_KIND}" != "step" || "${STEP_OUTCOME}" = "success" ]]; then
                continue
              fi
              publish_tag "platform-contract-step-${STEP_OUTCOME}-${STEP_NAME}-${MATRIX_OS}-jdk${MATRIX_JAVA}-${GITHUB_SHA}"
            done < "${result_file}"
          done

          if [[ "${MATRIX_RESULT}" = "success" ]]; then
            tag="platform-contract-verified-${GITHUB_SHA}"
          else
            tag="platform-contract-failed-${GITHUB_SHA}"
          fi
          publish_tag "${tag}"
