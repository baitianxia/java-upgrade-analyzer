name: Release Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1,4"

jobs:
  artifact-topology-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Run Independent Black-box Contract
        run: python scripts/quality_gate.py --profile blackbox

      - name: Run Artifact Topology Matrix
        run: >-
          python -m unittest -q
          tests.test_binary_generated_regression
          tests.test_binary_artifact_diff
          tests.test_binary_artifact_safety
          tests.test_database_contract_scan

  release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Install Runtime Dependencies
        run: python scripts/bootstrap_runtime.py

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          jdeps -version
          mvn -version

      - name: Run Release Quality Gate
        run: >-
          python scripts/quality_gate.py --profile release
          --json-out "${{ runner.temp }}/jua-release-quality-gate.json"

      - name: Upload Quality Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-release-quality-evidence
          path: ${{ runner.temp }}/jua-release-quality-gate.json
