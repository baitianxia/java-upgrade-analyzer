name: Release Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1,4"

jobs:
  artifact-topology-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Install Runtime Dependencies
        run: python -m pip install "tree-sitter==0.25.2" "tree-sitter-java==0.23.5"

      - name: Run Artifact Topology Matrix
        run: >-
          python -m unittest -q
          tests.test_runtime_topology_matrix
          tests.test_artifact_bytecode_catalog
          tests.test_artifact_safety
          tests.test_data_contract_analysis

  release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Install Runtime Dependencies
        run: python -m pip install "tree-sitter==0.25.2" "tree-sitter-java==0.23.5"

      - name: Verify Required Tools
        run: |
          java -version
          javac -version
          javap -version
          jdeps -version
          mvn -version

      - name: Materialize SHA-pinned real project
        run: >-
          python scripts/materialize_real_project_asset.py
          tests/fixtures/real_projects/commons-text.json
          --output-root /tmp/jua-real-assets

      - name: Run Release Quality Gate
        env:
          JUA_REAL_PROJECT_ROOT: /tmp/jua-real-assets/commons-text/.checkout
          JUA_REAL_FINAL_ARTIFACT: /tmp/jua-real-assets/commons-text/.checkout/target/commons-text-1.12.0.jar
        run: >-
          python scripts/quality_gate.py --profile release --real-case commons-text
          --continue-on-failure
          --report-root /tmp/jua-release-regression
          --json-out /tmp/jua-release-quality-gate.json

      - name: Upload Quality Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jua-release-quality-evidence
          path: |
            /tmp/jua-release-quality-gate.json
            /tmp/jua-release-regression
